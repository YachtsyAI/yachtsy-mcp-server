name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Discovery, challenges and 405s against a local server
        run: npm run smoke
      - name: Stdio server lists its tools
        run: npm run smoke:stdio

  plugins:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build the package (fails on any rule error)
        run: npm run build -- --profile all
      - name: Archives are reproducible
        run: |
          cp out/SHA256SUMS.txt "$RUNNER_TEMP/first.txt"
          npm run build -- --profile all
          diff "$RUNNER_TEMP/first.txt" out/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.node == 22
        with:
          name: yachtsy-openai-package
          path: |
            plugins/out/*.zip
            plugins/out/SHA256SUMS.txt
